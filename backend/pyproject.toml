[project]
name = "cafeconnect-backend"
version = "0.1.0"
description = "CafeConnect backend: FastAPI + PostgreSQL/pgvector + Redis"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.0",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "redis>=5.0",
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "pgvector>=0.3",
    "groq>=0.9",
    "google-genai>=0.1",
    "python-dotenv>=1.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
# E/F/I: the standard pycodestyle-errors + pyflakes + isort baseline.
# B008 (function-call-in-default-argument) is excluded: FastAPI's entire
# dependency-injection system is built on `Depends(...)` as a default
# argument value, so that rule is a false positive on every route signature.
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
