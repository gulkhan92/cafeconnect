services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cafeconnect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cafeconnect
      POSTGRES_PASSWORD: cafeconnect
      POSTGRES_DB: cafeconnect
    ports:
      - "5540:5432"
    volumes:
      - cafeconnect_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cafeconnect -d cafeconnect"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cafeconnect-redis
    restart: unless-stopped
    ports:
      - "6390:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: cafeconnect-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://cafeconnect:cafeconnect@postgres:5432/cafeconnect
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  cafeconnect_postgres_data:
